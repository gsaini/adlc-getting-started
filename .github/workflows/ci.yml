# Phase 4 — Verify. The same gate the Stop hook enforces locally, run on every PR.
name: CI

on:
  pull_request:
  workflow_call: # reused by deploy.yml, so main is verified before every release

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the migrations check compares against the base branch
      - name: Migrations are append-only
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-status "origin/$BASE"...HEAD -- migrations | grep -v '^A' || true)
          if [ -n "$changed" ]; then
            echo "::error::Existing migrations may not be modified or deleted — add a new migration instead."
            echo "$changed"
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (pnpm version from "packageManager")
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # typecheck + lint + tests (in workerd, local D1) with coverage thresholds + openspec validate
      - run: pnpm verify
