# Phase 6 — Release. main → verify → staging (automatic) → production (human approval).
# Runs only once Cloudflare is configured: `pnpm cf:setup` + CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID repo secrets. Until then it skips with a notice.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false # never interrupt a deploy halfway

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  ready:
    name: Cloudflare configured?
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::Deploy skipped — add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif grep -q REPLACE_WITH_ wrangler.jsonc; then
            echo "::notice::Deploy skipped — run 'pnpm cf:setup' and commit wrangler.jsonc."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  staging:
    needs: [verify, ready]
    if: needs.ready.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: |
            d1 migrations apply DB --remote --env staging
            deploy --env staging
      - name: Smoke test (full flow, throwaway data)
        run: node scripts/smoke.mjs "${{ steps.deploy.outputs.deployment-url }}"

  production:
    needs: staging
    runs-on: ubuntu-latest
    # The human gate: configure required reviewers on the "production" environment
    # (Settings → Environments). The job waits here until someone approves.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: |
            d1 migrations apply DB --remote --env production
            deploy --env production
      - name: Smoke test (read-only in production)
        run: node scripts/smoke.mjs "${{ steps.deploy.outputs.deployment-url }}" --read-only
