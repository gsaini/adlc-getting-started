# Phase 6 — Release: an AI reviewer alongside (never instead of) the human reviewer.
# Opt-in: add an ANTHROPIC_API_KEY repo secret and install the Claude GitHub App
# (https://github.com/apps/claude). Without the secret the job skips cleanly.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }} # secrets can't be used in `if:` directly
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "::notice::Claude review skipped — no ANTHROPIC_API_KEY secret configured."
      - if: env.HAS_KEY == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - if: env.HAS_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
